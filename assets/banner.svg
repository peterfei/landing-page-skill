<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bannerBg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Radial glow behind logo -->
  <circle cx="220" cy="320" r="260" fill="#06B6D4" opacity="0.04"/>

  <!-- Logo reproduction (scaled) -->
  <g transform="translate(80, 180) scale(0.5)">
    <!-- dot grid bg -->
    <rect x="96" y="96" width="320" height="320" rx="24" fill="none"/>
    <!-- Flow path -->
    <path d="M 140 160 Q 200 160 240 240 Q 280 320 340 320" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
    <!-- Chaos zone -->
    <rect x="118" y="132" width="18" height="18" rx="3" fill="#475569" opacity="0.6"/>
    <rect x="152" y="118" width="14" height="14" rx="2" fill="#475569" opacity="0.5"/>
    <rect x="108" y="168" width="16" height="16" rx="2.5" fill="#475569" opacity="0.45"/>
    <rect x="188" y="142" width="20" height="20" rx="3" fill="#475569" opacity="0.55"/>
    <rect x="138" y="196" width="15" height="15" rx="2" fill="#475569" opacity="0.5"/>
    <rect x="212" y="178" width="17" height="17" rx="2.5" fill="#475569" opacity="0.55"/>
    <!-- Transition zone -->
    <rect x="178" y="228" width="22" height="22" rx="4" fill="#64748B" opacity="0.65"/>
    <rect x="218" y="208" width="24" height="24" rx="4" fill="#0E7490" opacity="0.55"/>
    <rect x="198" y="268" width="20" height="20" rx="3.5" fill="#64748B" opacity="0.6"/>
    <rect x="252" y="242" width="26" height="26" rx="4.5" fill="#0E7490" opacity="0.6"/>
    <rect x="232" y="292" width="22" height="22" rx="4" fill="#64748B" opacity="0.55"/>
    <!-- Order zone -->
    <g filter="url(#glow)">
      <rect x="282" y="282" width="30" height="30" rx="6" fill="url(#cyanGrad)"/>
      <rect x="320" y="282" width="30" height="30" rx="6" fill="url(#cyanGrad)"/>
      <rect x="358" y="282" width="30" height="30" rx="6" fill="url(#cyanGrad)"/>
      <rect x="282" y="320" width="30" height="30" rx="6" fill="url(#cyanGrad)"/>
      <rect x="320" y="320" width="30" height="30" rx="6" fill="url(#cyanGrad)"/>
      <rect x="358" y="320" width="30" height="30" rx="6" fill="url(#cyanGrad)"/>
      <rect x="282" y="358" width="30" height="30" rx="6" fill="url(#cyanGrad)"/>
      <rect x="320" y="358" width="30" height="30" rx="6" fill="url(#cyanGrad)"/>
      <rect x="358" y="358" width="30" height="30" rx="6" fill="url(#cyanGrad)"/>
    </g>
    <!-- Core -->
    <circle cx="320" cy="320" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="320" cy="320" r="4" fill="#0F172A"/>
    <!-- Corner accents -->
    <path d="M 64 380 L 64 416 Q 64 448 96 448 L 132 448" fill="none" stroke="#06B6D4" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
    <path d="M 448 132 L 448 96 Q 448 64 416 64 L 380 64" fill="none" stroke="#06B6D4" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- Vertical accent line -->
  <rect x="380" y="180" width="3" height="280" rx="1.5" fill="url(#cyanGrad)" opacity="0.5"/>

  <!-- Title -->
  <text x="420" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#F8FAFC" letter-spacing="-2">Landing Page Skill</text>

  <!-- Chinese subtitle -->
  <text x="420" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#94A3B8" letter-spacing="1">全链路落地页生成 Agent Skill</text>

  <!-- English subtitle -->
  <text x="420" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#64748B" letter-spacing="0.5">文案策略 + 视觉设计 + 代码生成</text>

  <!-- Feature pills -->
  <g transform="translate(420, 390)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="#06B6D4" opacity="0.12"/>
    <rect x="0" y="0" width="140" height="32" rx="16" fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.35"/>
    <text x="70" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#22D3EE" text-anchor="middle">5阶段协议</text>

    <rect x="156" y="0" width="140" height="32" rx="16" fill="#06B6D4" opacity="0.12"/>
    <rect x="156" y="0" width="140" height="32" rx="16" fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.35"/>
    <text x="226" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#22D3EE" text-anchor="middle">11元素转化框架</text>

    <rect x="312" y="0" width="160" height="32" rx="16" fill="#06B6D4" opacity="0.12"/>
    <rect x="312" y="0" width="160" height="32" rx="16" fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.35"/>
    <text x="392" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#22D3EE" text-anchor="middle">反模式检测</text>
  </g>

  <!-- Right side: code decoration (abstract) -->
  <g transform="translate(980, 170)" opacity="0.12">
    <rect x="0" y="0" width="240" height="14" rx="3" fill="#06B6D4"/>
    <rect x="20" y="26" width="180" height="10" rx="2" fill="#475569"/>
    <rect x="20" y="44" width="220" height="10" rx="2" fill="#475569"/>
    <rect x="20" y="62" width="160" height="10" rx="2" fill="#475569"/>
    <rect x="0" y="86" width="200" height="14" rx="3" fill="#06B6D4" opacity="0.6"/>
    <rect x="20" y="110" width="190" height="10" rx="2" fill="#475569"/>
    <rect x="40" y="128" width="150" height="10" rx="2" fill="#475569"/>
    <rect x="40" y="146" width="170" height="10" rx="2" fill="#475569"/>
    <rect x="20" y="168" width="120" height="10" rx="2" fill="#475569"/>
    <rect x="0" y="192" width="160" height="14" rx="3" fill="#06B6D4" opacity="0.4"/>
    <rect x="20" y="216" width="210" height="10" rx="2" fill="#475569"/>
    <rect x="20" y="234" width="140" height="10" rx="2" fill="#475569"/>
    <rect x="0" y="258" width="100" height="14" rx="3" fill="#06B6D4" opacity="0.6"/>
  </g>

  <!-- Bottom accent line -->
  <rect x="420" y="460" width="400" height="2" rx="1" fill="#334155" opacity="0.4"/>

  <!-- Bottom tagline -->
  <text x="420" y="490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#475569" letter-spacing="0.5">Agent-Native  ·  全链路生成  ·  质量内置</text>

  <!-- Corner decorations -->
  <path d="M 40 40 L 40 80 Q 40 100 60 100 L 100 100" fill="none" stroke="#06B6D4" stroke-width="2" opacity="0.25" stroke-linecap="round"/>
  <path d="M 1240 600 L 1240 560 Q 1240 540 1220 540 L 1180 540" fill="none" stroke="#06B6D4" stroke-width="2" opacity="0.25" stroke-linecap="round"/>
</svg>
